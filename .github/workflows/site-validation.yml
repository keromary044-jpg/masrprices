name: MasrPrices site validation

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "_worker.js"
      - "_redirects"
      - "styles.css"
      - "products-data.json"
      - "products-directory.js"
      - "admin.html"
      - "admin.js"
      - "about.html"
      - "contact.html"
      - "privacy.html"
      - "terms.html"
      - "products/**"
      - "site-enhancements.js"
      - "app.js"
      - "worker.js"
      - "functions/api/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "robots.txt"
      - "sitemap.xml"
      - "seo-products.json"
      - "price-monitor/**"
      - ".github/workflows/site-validation.yml"
  pull_request:
    paths:
      - "index.html"
      - "_worker.js"
      - "_redirects"
      - "styles.css"
      - "products-data.json"
      - "products-directory.js"
      - "admin.html"
      - "admin.js"
      - "about.html"
      - "contact.html"
      - "privacy.html"
      - "terms.html"
      - "products/**"
      - "site-enhancements.js"
      - "app.js"
      - "worker.js"
      - "functions/api/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "robots.txt"
      - "sitemap.xml"
      - "seo-products.json"
      - "price-monitor/**"
      - ".github/workflows/site-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check admin.js
          node --check site-enhancements.js
          node --check products-directory.js
          node --input-type=module --check < _worker.js
          node --check sw.js
          node --input-type=module --check < worker.js
          node --input-type=module --check < price-updater/index.js
          node --input-type=module --check < price-monitor/worker.js
          node --input-type=module --check < "functions/products/[slug].js"
          for file in functions/api/*.js; do node --input-type=module --check < "$file"; done
      - name: Validate JSON, sitemap, SEO metadata and PWA manifest
        run: |
          python - <<'PY'
          import json, pathlib, re, xml.etree.ElementTree as ET
          root = pathlib.Path(".")
          for path in root.rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          manifest = json.loads((root / "manifest.webmanifest").read_text(encoding="utf-8"))
          assert manifest.get("start_url") == "/" and manifest.get("scope") == "/", "Invalid PWA start_url or scope"
          assert manifest.get("display") == "standalone", "PWA standalone display is missing"
          sitemap = ET.parse(root / "sitemap.xml").getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text for node in sitemap.findall("sm:url/sm:loc", ns)]
          assert len(urls) == len(set(urls)), "Sitemap contains duplicate URLs"
          assert urls, "Sitemap contains no URLs"
          base = "https://masrprices.pages.dev/"
          assert all(url.startswith(base) for url in urls), "Sitemap contains a URL outside the production origin"
          seo_products = json.loads((root / "seo-products.json").read_text(encoding="utf-8"))
          product_slugs = [item.get("slug") for item in seo_products]
          catalog = json.loads((root / "products-data.json").read_text(encoding="utf-8"))
          catalog_slugs = [item.get("slug") for item in catalog]
          assert set(product_slugs) == set(catalog_slugs), "SEO product data and public catalogue are out of sync"
          assert all(product_slugs) and len(product_slugs) == len(set(product_slugs)), "SEO product slugs are missing or duplicated"
          compare_api = (root / "functions/api/compare.js").read_text(encoding="utf-8")
          product_page = (root / "functions/products/[slug].js").read_text(encoding="utf-8")
          monitor = (root / "price-monitor/worker.js").read_text(encoding="utf-8")
          app = (root / "app.js").read_text(encoding="utf-8")
          assert "source_quality" in compare_api and "verifiedAt" in compare_api and "trusted_offer_count" in compare_api, "Comparison API must expose verified source quality and freshness"
          assert "priceFreshness" in product_page and "sourceNote" in product_page, "Product pages must explain price age and source quality"
          assert "price-check-failed" in monitor and "retryAfter" in monitor and "verifiedAt" in monitor, "Price monitor must track failures and verified checks separately"
          assert "sourceQuality" in app and "freshness" in app and "trustedOffers" in app, "Comparison UI must not label unverified offers as the lowest price"
          sitemap_slugs = [url[len(base + "products/"):].strip("/") for url in urls if url.startswith(base + "products/") and url != base + "products/"]
          product_index = (root / "products/index.html").read_text(encoding="utf-8")
          index_slugs = re.findall(r'href="/products/([^"/]+)/"', product_index)
          category_slugs = ["phones", "electronics", "home-appliances", "books", "cars", "groceries", "tools", "baby", "clothing", "furniture", "personal-care", "sports", "plants", "telecom"]
          assert all(base + "category/" + slug + "/" in urls for slug in category_slugs), "A category landing page is missing from the sitemap"
          assert all('href="/category/' + slug + '/"' in product_index for slug in category_slugs), "A category landing page is not linked from the product directory"
          assert set(product_slugs) == set(sitemap_slugs) == set(index_slugs), "Product index, SEO data and sitemap do not contain the same product slugs"
          sw = (root / "sw.js").read_text(encoding="utf-8")
          for required_asset in ['"./site-enhancements.js"', '"./assets/icon.svg"', '"./products/"']:
              assert required_asset in sw, f"Service worker precache is missing {required_asset}"
          assert 'url.pathname.endsWith(".json")' in sw, "Service worker does not refresh JSON data from the network"
          robots = (root / "robots.txt").read_text(encoding="utf-8")
          pages_worker = (root / "_worker.js").read_text(encoding="utf-8")
          assert "masrprices-new.keromary044.workers.dev" in pages_worker and "X-Frame-Options" in pages_worker, "Pages API proxy or security headers are missing"
          assert base + "sitemap.xml" in robots, "robots.txt does not point to the production sitemap"
          for name in ["index.html", "about.html", "contact.html", "privacy.html", "terms.html", "products/index.html"]:
              html = (root / name).read_text(encoding="utf-8")
              match = re.search('rel="canonical" href="([^"]+)"', html)
              assert match and match.group(1).startswith(base), f"Missing or incorrect canonical URL: {name}"
          home = (root / "index.html").read_text(encoding="utf-8")
          contact = (root / "contact.html").read_text(encoding="utf-8")
          admin = (root / "admin.html").read_text(encoding="utf-8")
          assert '<meta name="robots" content="noindex,nofollow">' in admin, "Admin page must be noindex"
          assert 'src="/products-directory.js"' in product_index, "Product directory is missing its external search script"
          assert '"./products-directory.js"' in sw, "Service worker is missing the directory search script"
          assert 'src="/site-enhancements.js"' in home, "Home page is missing the CSP-compatible enhancement script"
          assert 'src="/site-enhancements.js"' in contact, "Contact page is missing the CSP-compatible enhancement script"
          assert "<script>" not in home.lower(), "Inline script remains on the home page and conflicts with the CSP"
          assert "<script>" not in contact.lower(), "Inline script remains on the contact page and conflicts with the CSP"
          ids = set(re.findall('id="([^"]+)"', home))
          anchors = re.findall('href="#([^"]+)"', home)
          missing = sorted(set(anchors) - ids)
          assert not missing, "Broken home-page anchors: " + ", ".join(missing)
          print(f"Validated JSON files, {len(urls)} sitemap URLs, six canonical pages, PWA manifest and internal anchors.")
          PY
