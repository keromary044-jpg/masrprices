name: MasrPrices automatic price updates

on:
  push:
    paths:
      - "price-updater/**"
      - "price-feeds.json"
      - "**.json"
      - ".github/workflows/auto-price-update.yml"
      - "app.js"
      - "index.html"
      - "styles.css"
      - "worker.js"
      - "functions/**"
      - "migrations/**"
      - "wrangler.toml"
      - "real-estate.json"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: masrprices-price-updater
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get repository files
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --input-type=module --check < worker.js
          for file in functions/api/*.js; do node --input-type=module --check < "$file"; done
          node --input-type=module --check < functions/api/real-estate.js
          node --input-type=module --check < functions/api/real-estate-admin.js
          python -c "import json,glob; files=glob.glob('**/*.json',recursive=True); [json.load(open(p,encoding='utf-8')) for p in files]; print(f'Validated {len(files)} JSON files')"
      - name: Inspect official Ministry crop-price data interface
        run: |
          python - <<'PY'
          import re, urllib.request
          url = "https://www.agri.gov.eg/databases/83"
          request = urllib.request.Request(url, headers={"User-Agent":"MasrPrices-SourceResearch/1.0","Accept":"text/html"})
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  html = response.read(3_000_000).decode("utf-8", "replace")
                  print("AGRI_PAGE_STATUS", response.status, "BYTES", len(html))
              for value in re.findall(r'<script[^>]+src=["\']([^"\']+)', html, re.I):
                  print("AGRI_SCRIPT", value[:300])
              for value in re.findall(r'<form[^>]*>', html, re.I):
                  print("AGRI_FORM", value[:500])
              for match in re.finditer(r'<select\b[\s\S]*?</select>', html, re.I):
                  print("AGRI_SELECT", re.sub(r'\s+',' ',match.group(0))[:3500])
              for needle in ["function sendQuery", "function get_crops", "startDate"]:
                  position=html.find(needle)
                  if position >= 0:
                      print("AGRI_JS", needle, re.sub(r'\s+',' ',html[max(0,position-400):position+5000])[:5400])
              import time, urllib.parse, html as html_lib
              end=int(time.time()); start=end-14*86400
              for group in ["الخضروات","الفاكهة","الاسماك"]:
                  for label,from_ts,to_ts in [("recent",start,end),("archive",1600473600,1622073600)]:
                      params=urllib.parse.urlencode({"type_group":group,"item":from_ts,"item2":to_ts,"crop_name":"","draw":"1"})
                      target="https://www.agri.gov.eg/databases_search/83?"+params
                      try:
                          req=urllib.request.Request(target,headers={"User-Agent":"MasrPrices-SourceResearch/1.0","Accept":"text/html"})
                          with urllib.request.urlopen(req,timeout=20) as response:
                              body=response.read(2_000_000).decode("utf-8","replace")
                              tables=re.findall(r'<table\b[\s\S]*?</table>',body,re.I)
                              print("AGRI_QUERY",group,label,"STATUS",response.status,"BYTES",len(body),"TABLES",len(tables))
                              for table in tables[-2:]:
                                  plain=re.sub(r'<[^>]+>',' ',table)
                                  print("AGRI_TABLE",re.sub(r'\s+',' ',html_lib.unescape(plain))[:3500])
                      except Exception as error:
                          print("AGRI_QUERY_FAILED",group,label,type(error).__name__,str(error)[:250])
          except Exception as error:
              print("AGRI_PAGE_PROBE_FAILED", type(error).__name__, str(error)[:250])
          PY
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Worker security configuration
        run: |
          python - <<'PY'
          import tomllib
          with open("wrangler.toml", "rb") as f:
              config = tomllib.load(f)
          limits = config.get("ratelimits", [])
          expected = {"ADMIN_RATE_LIMITER", "PUBLIC_READ_RATE_LIMITER", "PUBLIC_WRITE_RATE_LIMITER", "SUGGESTION_RATE_LIMITER"}
          assert {item["name"] for item in limits} == expected, "Missing or unexpected rate limit bindings"
          ids = [item["namespace_id"] for item in limits]
          assert len(ids) == len(set(ids)), "Rate limit namespace IDs must be unique"
          for item in limits:
              simple = item["simple"]
              assert simple["limit"] > 0 and simple["period"] in (10, 60), "Invalid rate limit settings"
          print("Worker security configuration validated.")
          PY
      - name: Test price source matching and safety rules
        run: python -m unittest discover -s price-updater -p 'test_*.py'
      - name: Fetch and validate authorized price feeds
        env:
          PRICELENS_API_KEY: ${{ secrets.PRICELENS_API_KEY }}
          SAMA_LINK_API_KEY: ${{ secrets.SAMA_LINK_API_KEY }}
        run: python price-updater/github_actions_updater.py
      - name: Build complete product price coverage report
        run: python price-updater/coverage_report.py
      - name: Save price coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: masrprices-price-coverage
          path: price-coverage-report.json
          if-no-files-found: error
      - name: Save changed catalog files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "*.json"
          git reset -- price-coverage-report.json
          if git diff --cached --quiet; then
            echo "No price data changed."
          else
            git commit -m "Automated verified price update"
            git pull --rebase origin main
            git push
          fi
