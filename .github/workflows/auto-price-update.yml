name: MasrPrices automatic price updates

on:
  push:
    paths:
      - "price-updater/**"
      - "price-feeds.json"
      - "**.json"
      - ".github/workflows/auto-price-update.yml"
      - "app.js"
      - "index.html"
      - "styles.css"
      - "worker.js"
      - "functions/**"
      - "migrations/**"
      - "wrangler.toml"
      - "real-estate.json"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: masrprices-price-updater
  cancel-in-progress: false

jobs:
  update-prices:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get repository files
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --input-type=module --check < worker.js
          for file in functions/api/*.js; do node --input-type=module --check < "$file"; done
          node --input-type=module --check < functions/api/real-estate.js
          node --input-type=module --check < functions/api/real-estate-admin.js
          python -c "import json,glob; files=glob.glob('**/*.json',recursive=True); [json.load(open(p,encoding='utf-8')) for p in files]; print(f'Validated {len(files)} JSON files')"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Worker security configuration
        run: |
          python - <<'PY'
          import tomllib
          with open("wrangler.toml", "rb") as f:
              config = tomllib.load(f)
          limits = config.get("ratelimits", [])
          expected = {"ADMIN_RATE_LIMITER", "PUBLIC_READ_RATE_LIMITER", "PUBLIC_WRITE_RATE_LIMITER", "SUGGESTION_RATE_LIMITER"}
          assert {item["name"] for item in limits} == expected, "Missing or unexpected rate limit bindings"
          ids = [item["namespace_id"] for item in limits]
          assert len(ids) == len(set(ids)), "Rate limit namespace IDs must be unique"
          for item in limits:
              simple = item["simple"]
              assert simple["limit"] > 0 and simple["period"] in (10, 60), "Invalid rate limit settings"
          print("Worker security configuration validated.")
          PY
      - name: Test price source matching and safety rules
        run: python -m unittest discover -s price-updater -p 'test_*.py'
      - name: Fetch and validate authorized price feeds
        # Paid/keyed providers run only on the daily schedule. Pushes run only
        # the public, keyless Raneen feed to start importing verified prices.
        if: github.event_name == 'schedule' || github.event_name == 'push'
        env:
          PRICELENS_API_KEY: ${{ secrets.PRICELENS_API_KEY }}
          SAMA_LINK_API_KEY: ${{ secrets.SAMA_LINK_API_KEY }}
          APISH_API_KEY: ${{ secrets.APISH_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python price-updater/github_actions_updater.py
          else
            python - <<'PY'
            import sys
            sys.path.insert(0, "price-updater")
            import github_actions_updater as updater
            def skipped(*args, **kwargs):
                print("SKIPPED: paid/keyed provider is schedule-only")
                return 0
            updater.run_pricelens = skipped
            updater.run_sama_link = skipped
            updater.run_apish_jumia = skipped
            updater.run_apish_noon = skipped
            updater.run_open_prices = skipped
            raise SystemExit(updater.main())
            PY
          fi
      - name: Build complete product price coverage report
        run: python price-updater/coverage_report.py
      - name: Save price coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: masrprices-price-coverage
          path: price-coverage-report.json
          if-no-files-found: error
      - name: Discard generated report from worktree
        run: git restore --worktree -- price-coverage-report.json
      - name: Save changed catalog files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "*.json"
          git reset -- price-coverage-report.json
          if git diff --cached --quiet; then
            echo "No price data changed."
          else
            git commit -m "Automated verified price update"
            git pull --rebase origin main
            git push
          fi
