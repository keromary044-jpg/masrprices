name: MasrPrices automatic price updates

on:
  push:
    paths:
      - "price-updater/**"
      - "price-feeds.json"
      - ".github/workflows/auto-price-update.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: masrprices-price-updater
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get repository files
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and validate authorized price feeds
        run: python price-updater/github_actions_updater.py
      - name: Save changed catalog files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "*.json"
          if git diff --cached --quiet; then
            echo "No price data changed."
          else
            git commit -m "Automated verified price update"
            git push
          fi
