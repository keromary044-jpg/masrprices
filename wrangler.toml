name = "masrprices-new"
main = "worker.js"
compatibility_date = "2026-11-03"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Approximate per-location rate limits for public and administrative API routes.
[[ratelimits]]
name = "ADMIN_RATE_LIMITER"
namespace_id = "87304101"
simple = { limit = 12, period = 60 }

[[ratelimits]]
name = "PUBLIC_READ_RATE_LIMITER"
namespace_id = "87304102"
simple = { limit = 90, period = 60 }

[[ratelimits]]
name = "PUBLIC_WRITE_RATE_LIMITER"
namespace_id = "87304103"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "SUGGESTION_RATE_LIMITER"
namespace_id = "87304104"
simple = { limit = 5, period = 60 }
